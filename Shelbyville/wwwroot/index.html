<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shelbyville - Sistema de Gestión de Billar</title>
    <base href="/" />
    
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- MudBlazor CSS -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

    <!-- Font Awesome & Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Shelbyville.styles.css" rel="stylesheet" />
</head>

<body style="background-color: #0B1210; color: #F5F6F2; margin: 0; font-family: 'Inter', sans-serif;">
    <div id="app">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: radial-gradient(circle at center, #164F3B 0%, #0B1210 70%);">
            <img src="images/LogoShelbyville.png" alt="Shelbyville Billar" style="max-width: 240px; width: 80%; height: auto; margin-bottom: 24px; filter: drop-shadow(0 8px 24px rgba(0,0,0,0.85));" />
            <div style="width: 44px; height: 44px; border-radius: 50%; border: 3px solid #D4AF37; border-top-color: transparent; animation: spin 1s linear infinite; margin-bottom: 16px;"></div>
            <p style="color: #AAB8AE; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; margin: 0;">Cargando sistema...</p>
        </div>
    </div>

    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <div id="blazor-error-ui" style="display: none; background: #EF4444; color: white; padding: 12px; position: fixed; bottom: 0; width: 100%; text-align: center; z-index: 9999;">
        Ocurrió un error inesperado en la aplicación.
        <a href="." class="reload" style="color: white; font-weight: bold; margin-left: 10px;">Recargar</a>
    </div>

    <!-- MudBlazor JS -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Script de Descarga de Archivos Excel Oficiales -->
    <script>
        window.shelbyvilleDescargarExcel = function (nombreArchivo, base64Datos) {
            try {
                const bytesTexto = atob(base64Datos);
                const numerosBytes = new Array(bytesTexto.length);
                for (let i = 0; i < bytesTexto.length; i++) {
                    numerosBytes[i] = bytesTexto.charCodeAt(i);
                }
                const arregloBytes = new Uint8Array(numerosBytes);
                const blob = new Blob([arregloBytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
                const enlace = document.createElement("a");
                const url = URL.createObjectURL(blob);
                enlace.href = url;
                enlace.download = nombreArchivo;
                document.body.appendChild(enlace);
                enlace.click();
                document.body.removeChild(enlace);
                URL.revokeObjectURL(url);
            } catch (err) {
                console.error("Error al descargar archivo Excel:", err);
            }
        };
    </script>
</body>

</html>
