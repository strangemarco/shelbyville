name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WebAssembly
        run: dotnet publish Shelbyville/Shelbyville.csproj -c Release -o dist

      - name: Copy vercel.json to build output
        run: cp vercel.json dist/wwwroot/

      - name: Configure Vercel Project
        run: |
          mkdir -p dist/wwwroot/.vercel
          echo '{"orgId":"${{ secrets.VERCEL_ORG_ID }}","projectId":"${{ secrets.VERCEL_PROJECT_ID }}"}' > dist/wwwroot/.vercel/project.json

      - name: Deploy to Vercel
        run: npx --yes vercel deploy dist/wwwroot --prod --token="${{ secrets.VERCEL_TOKEN }}" --yes
